<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 | Flask DevOps Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="name-modal" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
    <div class="name-modal-card">
      <h2 id="name-modal-title">Who is playing?</h2>
      <p>Enter your name so we can track the high score.</p>
      <form id="name-form">
        <label class="sr-only" for="player-name">Your name</label>
        <input id="player-name" name="player-name" type="text" maxlength="40" autocomplete="nickname" placeholder="Your name" required>
        <button type="submit">Start game</button>
      </form>
    </div>
  </div>

  <main class="container">
    <header class="topbar">
      <div>
        <h1>2048</h1>
        <p class="player-line">Playing as <strong id="player-label">—</strong></p>
      </div>
      <div class="scores">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>YOUR BEST</span><strong id="best">0</strong></div>
        <div class="record-box">
          <span>RECORD</span>
          <strong id="record-display">—</strong>
        </div>
      </div>
    </header>

    <section class="intro">
      <p>Join the tiles, reach <strong>2048</strong>. Use arrow keys or swipe.</p>
      <button id="new-game" type="button">New Game</button>
    </section>

    <section class="game-board" id="board" aria-label="2048 game board" aria-hidden="true"></section>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer>
      <span>Health: <a href="/healthz">/healthz</a></span>
      <span>Metrics: <a href="/metrics">/metrics</a></span>
    </footer>
  </main>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
