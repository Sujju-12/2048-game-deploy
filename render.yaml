# Render pulls a pre-built image from Docker Hub (built & pushed by GitHub Actions).
# https://render.com/docs/deploy-an-image
services:
  - type: web
    name: 2048-game
    runtime: image
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    image:
      url: docker.io/srujan12/2048-game:latest
