# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 2048-game
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # Deploy after CI passes — GitHub Actions calls the Render deploy hook (.github/workflows/ci-cd.yml)
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
