name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Run tests only (no Docker Hub push / Render deploy)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: 2048-game
  DOCKER_IMAGE: srujan12/2048-game
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: PYTHONPATH=. pytest -q

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  push-dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.skip_deploy == false)
      )
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DH_USER}" ] || [ -z "${DH_TOKEN}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.DOCKER_IMAGE }}:latest
            docker.io/${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy on Render (API)
    runs-on: ubuntu-latest
    needs: [test, docker, push-dockerhub]
    if: >
      needs.test.result == 'success' &&
      needs.docker.result == 'success' &&
      needs.push-dockerhub.result == 'success'
    environment: production
    steps:
      - name: Require Render API secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "::error::Set RENDER_API_KEY and RENDER_SERVICE_ID (see docs/GITHUB-ACTIONS.md)."
            exit 1
          fi

      - name: Trigger deploy
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "$resp" | jq .
          deploy_id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "${deploy_id}" ]; then
            echo "::error::Could not start Render deploy."
            exit 1
          fi
          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            resp=$(curl -fsS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            status=$(echo "$resp" | jq -r '.status')
            echo "[$i] status=${status}"
            case "${status}" in
              live) echo "Deploy succeeded."; exit 0 ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy failed (${status}). Last live release unchanged."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Deploy timed out."
          exit 1
