replicaCount: 2

image:
  repository: srujan12/2048-game
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  # Enable after kube-prometheus-stack CRDs are installed (see docs/HELM-OBSERVABILITY.md)
  enabled: false
  interval: 30s
  path: /metrics

env:
  PORT: "5000"
  MAX_CONTENT_LENGTH: "16384"
