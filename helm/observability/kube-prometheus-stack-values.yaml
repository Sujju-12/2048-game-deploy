# Prometheus + Grafana + Alertmanager (Prometheus Operator CRDs included)
# Tuned for Kind: control-plane metrics (etcd, scheduler, controller-manager, kube-proxy)
# are not reachable on the node IP — disable those scrapes to avoid "connection refused" noise.
fullnameOverride: kube-prometheus-stack

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

grafana:
  enabled: true
  adminUser: admin
  adminPassword: changeme
  defaultDashboardsEnabled: true
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  enabled: true

defaultRules:
  create: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
